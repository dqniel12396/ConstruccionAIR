<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OTech AirNet · Mapa de estaciones</title>
  <link rel="stylesheet" href="leaflet/leaflet.css">
  <script defer src="leaflet/leaflet.js"></script>
  <script defer src="mapa-estaciones.js"></script>
  <style>
    *{box-sizing:border-box} body{margin:0;font:14px system-ui,sans-serif;color:#edf6f6;background:#101b29}
    main{display:flex;flex-direction:column;height:100vh;height:100dvh}
    header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 14px}
    h1{font-size:16px;margin:0} small{color:#b5c5d1} label{display:flex;align-items:center;gap:6px}
    select{padding:5px;border:1px solid #627789;background:#172736;color:white;border-radius:6px}
    #map{flex:1;background:#e0e9e7}.valor{background:#123e47;color:white;border:2px solid white;border-radius:16px;text-align:center;font:bold 13px/24px system-ui;box-shadow:0 1px 5px #1236}
  </style>
</head>
<body><main><header><div><h1>Estaciones OTech</h1><small>Indicadores de demostración</small></div>
<label>Indicador <select id="indicador"><option value="pm25">PM2.5 (µg/m³)</option><option value="pm10">PM10 (µg/m³)</option><option value="hr">Humedad (%)</option><option value="temp">Temperatura (°C)</option></select></label></header>
<div id="map" aria-label="Mapa de estaciones de Bogotá y la Sabana"></div></main></body>
</html>
