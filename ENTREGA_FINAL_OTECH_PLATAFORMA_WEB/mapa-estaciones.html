<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTech AirNet · Red Geo-Espacial de Calidad del Aire (Bogotá & Sabana)</title>
  <link rel="stylesheet" href="leaflet/leaflet.css">
  <link rel="stylesheet" href="panel-empresa.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <script defer src="leaflet/leaflet.js"></script>
  <script defer src="mapa-estaciones.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      color: #edf6f6;
      background: #090d16;
      overflow: hidden;
    }
    main {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 18px;
      background: #0d131f;
      border-bottom: 1px solid #1e293b;
      z-index: 10;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #0d9488, #2dd4bf);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #042f2e;
      font-weight: 800;
      font-size: 16px;
    }
    h1 {
      font-size: 1.05rem;
      font-weight: 750;
      margin: 0;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    small {
      color: #94a3b8;
      font-size: 0.75rem;
    }
    .controls-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .indicator-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #cbd5e1;
    }
    select {
      padding: 6px 12px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #2dd4bf;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.82rem;
      outline: none;
      cursor: pointer;
    }
    select:focus {
      border-color: #14b8a6;
    }
    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      color: #cbd5e1;
      background: #1e293b;
      border: 1px solid #334155;
      transition: all 0.2s ease;
    }
    .nav-btn:hover {
      color: #ffffff;
      background: #334155;
      border-color: #475569;
    }
    .nav-btn-highlight {
      background: rgba(20, 184, 166, 0.15);
      border-color: rgba(20, 184, 166, 0.4);
      color: #2dd4bf;
    }
    .nav-btn-highlight:hover {
      background: #14b8a6;
      color: #042f2e;
    }
    #map {
      flex: 1;
      width: 100%;
      height: 100%;
      border-radius: 0;
      border: none;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand-wrap">
        <div class="brand-logo">💨</div>
        <div>
          <h1>
            <span>OTech AirNet</span>
            <span style="font-size: 10px; padding: 2px 6px; border-radius: 9999px; background: rgba(45,212,191,0.15); color: #2dd4bf; border: 1px solid rgba(45,212,191,0.3); font-family: monospace;">GIS v2.4</span>
          </h1>
          <small>Red Telemétrica de Monitoreo Ambiental • Bogotá & Sabana de Cundinamarca</small>
        </div>
      </div>

      <div class="controls-wrap">
        <label class="indicator-label">
          <span>Variable de Red:</span>
          <select id="indicador">
            <option value="pm25" selected>PM2.5 (µg/m³) - Partículas Finas</option>
            <option value="pm10">PM10 (µg/m³) - Partículas Gruesas</option>
            <option value="hr">Humedad Relativa (%)</option>
            <option value="temp">Temperatura Ambiente (°C)</option>
          </select>
        </label>
        <a href="portal.html" class="nav-btn nav-btn-highlight">📊 Portal Cloud & Empresa</a>
        <a href="index.html" class="nav-btn">🏭 Modelo 3D Planta</a>
      </div>
    </header>

    <div id="map" aria-label="Mapa Geo-Espacial Interactivo de Calidad del Aire OTech"></div>
  </main>
</body>
</html>
